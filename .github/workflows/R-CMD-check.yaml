# Uses the official r-lib/actions v2 package-check workflow.
# Reference: https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: macos-latest, r: 'release', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: ubuntu-latest, r: 'release', manual: true, args: 'c("--as-cran")'}
          - {os: ubuntu-latest, r: 'devel', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: ubuntu-latest, r: 'oldrel-1', manual: false, args: 'c("--as-cran", "--no-manual")'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual
        env:
          TINYTEX_INSTALLER: TinyTeX
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args }}
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: true
      - name: Fresh installation with static HTML help
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", INSTALL_opts = "--html")
          for (topic in c("copy_photos_to_plots", "write_into_image", "plotphotos-package")) {
            stopifnot(length(utils::help(topic, package = "plotphotos")) > 0L)
            page <- system.file("html", paste0(topic, ".html"), package = "plotphotos")
            stopifnot(nzchar(page), file.exists(page))
            html <- paste(readLines(page, warn = FALSE), collapse = "\n")
            stopifnot(!grepl("Internal Server Error", html, fixed = TRUE))
          }
