# Uses the official r-lib/actions v2 package-check workflow.
# Reference: https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: macos-latest, r: 'release', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: ubuntu-latest, r: 'release', manual: true, args: 'c("--as-cran")'}
          - {os: ubuntu-latest, r: 'devel', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: ubuntu-latest, r: 'oldrel-1', manual: false, args: 'c("--as-cran", "--no-manual")'}
          - {os: ubuntu-22.04, r: '4.3.3', manual: false, args: 'c("--as-cran", "--no-manual")'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual
        env:
          TINYTEX_INSTALLER: TinyTeX
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args }}
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: true
      - name: Install without static HTML (exercise dynamic help)
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", INSTALL_opts = "--no-html")
      - name: Verify installed help in a fresh R session
        shell: Rscript {0}
        run: |
          topics <- c("copy_photos_to_plots", "write_into_image")
          stopifnot(setequal(names(tools::Rd_db("plotphotos")), paste0(topics, ".Rd")))
          package_path <- find.package("plotphotos")
          get_help_file <- getFromNamespace(".getHelpFile", "utils")
          handler <- getFromNamespace("httpd", "tools")
          for (topic in topics) {
            h <- utils::help(topic, package = "plotphotos")
            stopifnot(length(h) == 1L)
            rd <- get_help_file(h)
            target <- tempfile(fileext = ".html")
            tools::Rd2HTML(rd, out = target, package = package_path, dynamic = TRUE)
            stopifnot(file.exists(target), file.info(target)$size > 0)
            response <- handler(paste0("/library/plotphotos/html/", topic, ".html"), query = NULL)
            status <- response[["status code"]]
            stopifnot(is.null(status) || identical(as.integer(status), 200L))
            html <- response$payload
            if (is.null(html) && !is.null(response$file)) html <- readLines(response$file, warn = FALSE)
            stopifnot(is.character(html), length(html) > 0L)
            html <- paste(html, collapse = "\n")
            stopifnot(grepl("<html", html, ignore.case = TRUE), grepl(topic, html, fixed = TRUE))
            stopifnot(!grepl("Internal Server Error|httpd error", html, ignore.case = TRUE))
            unlink(target)
          }
